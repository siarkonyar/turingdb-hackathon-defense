[project]
name = "turingdb-hackathon-defense"
version = "0.1.0"
description = "EDTH x TuringDB defence graph datasets, the fused 'theatre' operating picture and its LLM agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "tabulate>=0.10.0",
    "turingdb==3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]
